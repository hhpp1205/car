plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.jeonbuk.repair'
version = '1.2.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.swing']
}

ext {
    hibernateVersion = '6.4.4.Final'
}

dependencies {
    // Hibernate ORM (Jakarta API)
    implementation "org.hibernate.orm:hibernate-core:${hibernateVersion}"
    implementation "org.hibernate.orm:hibernate-community-dialects:${hibernateVersion}"

    // SQLite JDBC
    implementation 'org.xerial:sqlite-jdbc:3.45.3.0'

    // AtlantaFX — 모던한 JavaFX 테마 (Primer/Cupertino/Nord/Dracula)
    implementation 'io.github.mkpaz:atlantafx-base:2.0.1'

    // Ikonli — JavaFX용 아이콘 라이브러리 (FontAwesome 5 free pack)
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.3.1'
    implementation 'org.kordamp.ikonli:ikonli-fontawesome5-pack:12.3.1'

    // Apache POI (Excel I/O)
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'ch.qos.logback:logback-classic:1.5.6'
    // Hibernate 내부에서 Log4j2 API 를 사용하는 경로가 일부 있어 SLF4J 로 라우팅
    implementation 'org.apache.logging.log4j:log4j-to-slf4j:2.23.1'

    // Test
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
    testRuntimeOnly  'org.junit.platform:junit-platform-launcher'

    // TestFX — JavaFX UI 테스트 (FxRobot, ApplicationExtension)
    //
    // 헤드리스(Monocle) 미사용 사유:
    //   - JavaFX 21 Windows 빌드의 javafx-graphics jar 에는 com.sun.glass.ui.monocle 클래스가
    //     포함돼 있지 않다 (OpenJFX 의 monocle 은 Linux 전용으로 패키징됨).
    //   - 외부 openjfx-monocle:jdk-12.0.1+2 jar 는 JavaFX 17+ 와 internal API 가 어긋나
    //     AbstractMethodError 가 난다.
    //   - 따라서 headed 모드로 동작한다. Windows 로컬에서 테스트 실행 시 창이 잠깐 뜬다.
    //   - CI (Ubuntu) 는 .github/workflows/ci.yml 의 xvfb-run 으로 가상 디스플레이를 제공.
    testImplementation 'org.testfx:testfx-core:4.0.18'
    testImplementation 'org.testfx:testfx-junit5:4.0.18'
    // testfx-core 의 일부 시그니처가 Matcher 를 노출 — 컴파일 타임에 필요
    testImplementation 'org.hamcrest:hamcrest:2.2'
}

application {
    // 개발용 ./gradlew run 은 JavaFX 플러그인이 모듈 처리를 해주므로 Main 직접 사용 가능
    mainClass = 'com.jeonbuk.repair.Main'
}

jacoco {
    toolVersion = '0.8.11'
}

tasks.named('test') {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
        showExceptions = true
        showStackTraces = true
        exceptionFormat 'full'
    }

    // 통합 테스트가 SQLite 파일을 임시 생성 — JVM 별 격리
    maxParallelForks = 1

    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required  = true
        html.required = true
    }
}

// `gradle check` 가 자동으로 test 를 호출하도록 (기본 동작이지만 명시)
tasks.named('check') {
    dependsOn tasks.named('test')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation']
}

// 테스트 데이터 100건 시드 — `./gradlew seedTestData`
tasks.register('seedTestData', JavaExec) {
    group = 'application'
    description = '입고 테스트 데이터 100건을 사용자 영역 DB 에 적재한다 (멱등 아님). 별도 위치는 JEONBUK_REPAIR_HOME 환경변수.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.jeonbuk.repair.util.TestDataSeeder'
}

// 입/출고관리 폼 레이아웃 스냅샷 — `./gradlew run --args="snapshot"`
// build/snapshots/layout.png 생성. 임시 DB 사용으로 사용자 데이터 영향 없음.
// 별도 task 를 만들지 않는 이유: JavaFX 모듈 path 가 application 플러그인의 run 태스크에만
// 자동 적용되므로, run 태스크를 재사용하고 Main.main 에서 args 로 분기.

// ─────────────────────────────────────────────────────────────────────
// 배포 — jpackage 로 .exe 인스톨러 생성
//
// 사전 조건 (개발자 PC 에 1회만 설치):
//   1. JDK 17 (Liberica Full 등 — jpackage · JavaFX 모듈 포함)
//   2. WiX Toolset 3.14 — jpackage 가 .exe 만들 때 내부적으로 호출
//
// 실행:
//   ./gradlew jpackage
// 결과:
//   build/jpackage/전북공업사-<version>.exe
// ─────────────────────────────────────────────────────────────────────

// 1) JavaFX 의존성을 포함한 모든 런타임 jar 를 한 폴더에 모은다 (jpackage --input)
tasks.register('jpackageStage', Copy) {
    group = 'distribution'
    description = 'jpackage 입력 폴더 구성 — 메인 jar + 런타임 의존성을 build/jpackage-input 에 복사.'
    dependsOn tasks.named('jar')
    from configurations.runtimeClasspath
    from tasks.named('jar')
    into layout.buildDirectory.dir('jpackage-input')
}

// 2) jpackage 호출 — Windows .exe 인스톨러
tasks.register('jpackage', Exec) {
    group = 'distribution'
    description = '.exe 인스톨러 생성 (build/jpackage/). WiX Toolset 3.14 필요.'
    dependsOn tasks.named('jpackageStage')

    def stageDir   = layout.buildDirectory.dir('jpackage-input').get().asFile
    def outDir     = layout.buildDirectory.dir('jpackage').get().asFile
    def mainJarName = "${project.name}-${project.version}.jar"

    doFirst {
        // 이전 결과물 삭제 — jpackage 가 동일 파일 존재 시 실패함
        delete outDir
        outDir.mkdirs()
    }

    workingDir = projectDir

    // WiX 3.x 는 jpackage 임시 경로에 한글이 들어가면 light.exe 가 311 로 죽는다.
    // 해결: jpackage --name 은 ASCII 로, 앱 창 제목은 Main.java 의 stage.setTitle() 로 한글 표기.
    // 영향: 설치 폴더명 · 시작메뉴 항목명 · .exe 파일명만 ASCII (사용자가 보는 앱 화면 자체는 한글).
    def cmd = [
            'jpackage',
            '--name',         'JeonbukRepair',
            '--app-version',  project.version.toString().replaceAll('[^0-9.]', '0'),  // jpackage 는 숫자 버전만 허용
            '--vendor',       'Jeonbuk Engineering',
            '--description',  'Auto repair shop management system',
            '--input',        stageDir.absolutePath,
            '--main-jar',     mainJarName,
            '--main-class',   'com.jeonbuk.repair.Launcher',
            '--dest',         outDir.absolutePath,
            '--type',         'exe',
            '--win-menu',
            '--win-menu-group', 'JeonbukRepair',
            '--win-shortcut',
            '--win-dir-chooser',
            '--win-per-user-install',
            '--java-options', '-Dfile.encoding=UTF-8'
    ]

    // 아이콘 파일이 있으면 포함
    def iconFile = file('src/main/resources/icon.ico')
    if (iconFile.exists()) {
        cmd += ['--icon', iconFile.absolutePath]
    }

    commandLine cmd
}
